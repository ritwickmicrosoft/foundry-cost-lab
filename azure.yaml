# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-cost-lab
metadata:
  template: foundry-cost-lab@1.0.0
infra:
  provider: bicep
  path: infra
services:
  web:
    project: ./web
    language: ts
    host: staticwebapp
    dist: dist
  api:
    project: ./api
    language: ts
    host: function
    remoteBuild: true